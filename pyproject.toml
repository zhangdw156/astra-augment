[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-augment"
dynamic = ["version"]
description = "SFT data augmentation via conversation truncation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click>=8.0"]

[project.scripts]
astra-augment = "astra_augment.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_augment"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
